[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-wallet-rebalancer"
version = "0.1.0"
description = "Read-only Trezor portfolio monitor and rebalance planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
hardware-wallet-rebalancer = "wallet_rebalancer.cli:main"

[tool.setuptools.packages.find]
include = ["wallet_rebalancer*"]
